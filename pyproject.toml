[tool.ruff.lint.pep8-naming]
ignore-names = ["SublimeFileBrowser"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]        # sort imports, like the sorting you saw in your earlier ruff pass

[tool.ruff.lint.per-file-ignores]
# Deferrable tests yield lambdas that the runner evaluates before the loop continues,
# so a loop variable captured in such a lambda can't change while it's in use.
"tests/*" = ["B023"]

[tool.ruff.format]
quote-style = "double"
# quote-style = "preserve"     # keep ' vs " as written
