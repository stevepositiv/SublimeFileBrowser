# Development tooling only; Sublime and Package Control don't read this file.
# Install the tools with `pip install --group dev` (pip >= 25.1).

[dependency-groups]
dev = [
    "flake8",
    "Flake8-pyproject",
    "mypy",
    "ruff",
    "sublime-text-stubs==4213.*",
    "typing_extensions==4.16.0",
    "watchdog==7.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]        # sort imports, like the sorting you saw in your earlier ruff pass

[tool.ruff.lint.pep8-naming]
ignore-names = ["SublimeFileBrowser"]

[tool.ruff.lint.per-file-ignores]
# Deferrable tests yield lambdas that the runner evaluates before the loop continues,
# so a loop variable captured in such a lambda can't change while it's in use.
"tests/*" = ["B023"]

[tool.ruff.format]
quote-style = "double"
# quote-style = "preserve"     # keep ' vs " as written

# Read via the Flake8-pyproject plugin
[tool.flake8]
max-line-length = 100
ignore = ["E221", "E241", "E251", "E701", "E702", "E731", "W503", "W504"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
mypy_path = ".."
sqlite_cache = true

[[tool.mypy.overrides]]
module = "tests"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["unittesting", "package_control.*", "package_events.*", "watchdog.*"]
ignore_missing_imports = true
