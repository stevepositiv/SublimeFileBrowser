[mypy]
python_version = 3.14
check_untyped_defs = True
warn_unused_ignores = True
warn_unreachable = True
mypy_path =
    ..
sqlite_cache = True

[mypy-tests]
ignore_errors = True

[mypy-unittesting]
ignore_missing_imports = True

[mypy-package_control.*]
ignore_missing_imports = True

[mypy-package_events.*]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True
